[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratigraph-chatbot"
# Kept in step with `app/main.py.__version__`; static metadata cannot
# import, so this is the one unavoidable repetition and a test refuses a
# disagreement. See that module for what the number means.
version = "1.6.0.dev1"
description = "The StratiGraph field assistant — an orchestrator: voice → intent → tool → a DTC-attributed write on the shared graph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Emanuel Demetrescu", email = "emanuel.demetrescu@cnr.it" }]
keywords = ["extended matrix", "archaeology", "assistant", "knowledge graph"]

# Four lines, and the shape is the argument: this service orchestrates, it does
# not own a domain. Everything it knows about stratigraphy comes from s3Dgraphy;
# everything it knows about identity comes from the realm; the heavy AI (Whisper,
# the LLM) runs on the Field Computing Node and is reached, not bundled.
dependencies = [
    # The floor is dev22 (2026-09-28), the first PUBLISHED release that carries
    # both things this app reads from the library: `s3dgraphy.contract.core`
    # (`app/contract.py`, landed inside the dev14 line — which is why the floor
    # sat at dev13 with an import-time check until a release carried it) and
    # `s3dgraphy.tools.datamodel_i18n` (the qualia names in the CARD's language,
    # `app/scheda.py::measuring_qualia`). With dev22 the measures come out in the
    # card's language, not in the English fallback — measured, report
    # 2026-10-27-NIGHT-il-giro-di-chiusura.
    "s3dgraphy>=1.6.0.dev32",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # The room's WIRE. `uvicorn[standard]` already pulls this in, and relying on
    # that would be relying on somebody else's extra: the write path needs a
    # WebSocket CLIENT (`websockets.sync.client`, 12+), which is a different
    # reason from serving one. Declared so a build that drops the extra fails at
    # install rather than at the first thing somebody says in a trench.
    "websockets>=12",
    # THE SCHEDA'S FORMAT. `app/scheda.py` reads a `stratigraph-templates`
    # definition, and those are YAML because a definition's COMMENTS are part
    # of the datum (that repository's SPEC.md §0).
    #
    # Declared even though it was already installed, and the reason is the same
    # one written above for `websockets`: it was in the environment as nobody's
    # declared dependency (`pip show pyyaml` → `Required-by:` empty), so a build
    # that resolved differently would have failed at the first scheda somebody
    # opened in a trench rather than at install.
    #
    # NOTE WHAT IS **NOT** HERE: `stratigraph-templates` itself. Its Python is
    # the authoring engine and the A4 print, and it runs on a server; the module
    # has to work offline in a browser. So the definition travels as DATA and
    # this service only reads it — see `app/scheda.py` for the whole argument.
    "PyYAML>=6",
    # Auth is a hard dependency for the reason StratiGraph Server states: a build that
    # cannot verify a token comes up open, and this one WRITES to a shared graph.
    "PyJWT[crypto]>=2.8",
    # The device sends a recording and a photo in ONE request (that is how the
    # gesture happens on a dig), so the multipart parser is not optional.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The object store for photos. Optional the way it is in StratiGraph Server: a single-node
# FCN can keep them on a volume, and a build without the client must fail at
# construction with a sentence rather than at the first upload.
s3 = ["minio>=7.2"]
# Speech-to-text ON THE NODE. Never a hard dependency: the assistant must run
# headless, in a test, and against ATRIUM (which already hands over the text).
stt = ["faster-whisper>=1.0"]
dev = [
    "pytest>=7",
    "httpx>=0.27",
    # THE BROWSER TESTS' DRIVER — a TEST dependency, never the app's: the page
    # ships to a tablet with no build step and nothing of this. Declared because
    # the tests `importorskip` it, and an undeclared driver means a checkout on
    # another machine SKIPS the cache, RTL and field-door tests in silence and
    # reports green (measured on 24 October: installed in one .venv by hand, in
    # nobody's list). They drive the system Chrome (`channel="chrome"`), so no
    # `playwright install` is needed where Chrome is.
    "playwright>=1.40",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
